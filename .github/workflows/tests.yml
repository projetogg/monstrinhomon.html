name: Tests (Vitest)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/group-species-passives-skills
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar patch determinístico
        run: |
          node scripts/temp-apply-group-species-skill-passives.mjs
          node scripts/temp-fix-group-passive-parity-assertions.mjs

      - name: Testar passivas de espécie
        run: npm run test:species-passive-parity-v2-2

      - name: Testar execução de skills Group
        run: npx vitest run tests/groupSkillExecution.test.js

      - name: Testar paridade do harness
        run: npm run test:combat-parity-v2-2

      - name: Testar simulador
        run: npm run test:combat-simulation-v2-2

      - name: Suíte geral
        run: npm test

      - name: Smoke Wild
        run: npm run test:wild-loop:vitest

      - name: Validar dados
        run: npm run validate-data

      - name: Validar assets
        run: npm run validate:monster-assets

      - name: Publicar runtime e testes validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/groupActions.js tests/speciesPassiveModeParityV22.test.js tests/groupSkillExecution.test.js
          git commit -m "fix(combat): despachar passivas de espécie nas skills Group"
          git push origin HEAD:codex/group-species-passives-skills
