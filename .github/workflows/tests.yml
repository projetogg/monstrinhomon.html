name: Tests (Vitest)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-and-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/wild-shieldhorn-order
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar DEC-SPECIES-DEF-01
        run: node scripts/temp-apply-shieldhorn-order.mjs

      - name: Validar paridade específica
        run: |
          npm run test:species-passive-parity-v2-2
          npm run test:combat-parity-v2-2
          npm run test:combat-simulation-v2-2

      - name: Testes unitários (Vitest)
        run: npm test

      - name: Smoke Wild Loop (Vitest)
        run: npm run test:wild-loop:vitest

      - name: Validar dados
        run: npm run validate-data

      - name: Validar assets de monstrinhos
        run: npm run validate:monster-assets

      - name: Publicar patch e restaurar CI
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          rm -f .github/workflows/apply-wild-shieldhorn-order.yml
          rm -f docs/.trigger-wild-shieldhorn-order
          rm -f scripts/temp-apply-shieldhorn-order.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat/wildActions.js tests/speciesPassiveModeParityV22.test.js .github/workflows/tests.yml .github/workflows/apply-wild-shieldhorn-order.yml docs/.trigger-wild-shieldhorn-order scripts/temp-apply-shieldhorn-order.mjs
          git commit -m "fix(combat): alinhar ordem defensiva do shieldhorn no Wild"
          git push origin HEAD:codex/wild-shieldhorn-order

  wild-loop-e2e:
    runs-on: ubuntu-latest
    needs: unit-and-validation

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: codex/wild-shieldhorn-order

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E Wild Loop (Playwright)
        run: npm run test:wild-loop
