name: Tests (Vitest)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-and-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/matriz-quantitativa-passivas-especie-v2-2
          fetch-depth: 0

      - name: Aplicar arquivos da matriz
        run: |
          base64 -d tmp/species-matrix.tar.gz.b64 > /tmp/species-matrix.tar.gz
          tar -xzf /tmp/species-matrix.tar.gz -C .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Testar matriz quantitativa de espécies
        run: npm run test:species-passive-quantitative-v2-2

      - name: Testes unitários (Vitest)
        run: npm test

      - name: Smoke Wild Loop (Vitest)
        run: npm run test:wild-loop:vitest

      - name: Validar dados
        run: npm run validate-data

      - name: Validar assets de monstrinhos
        run: npm run validate:monster-assets

      - name: Publicar patch validado
        run: |
          rm -f tmp/species-matrix.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/combat/speciesPassiveQuantitativeHarness.js \
            scripts/simulate-species-passives-v2-2.mjs \
            tests/speciesPassiveQuantitativeMatrixV22.test.js \
            docs/prompts/PROMPT_MATRIZ_QUANTITATIVA_PASSIVAS_ESPECIE_V2_2.md \
            package.json
          git add -u tmp/species-matrix.tar.gz.b64
          git commit -m "test(combat): adicionar matriz quantitativa de passivas de espécie"
          git push origin HEAD:codex/matriz-quantitativa-passivas-especie-v2-2

  wild-loop-e2e:
    runs-on: ubuntu-latest
    needs: unit-and-validation

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: codex/matriz-quantitativa-passivas-especie-v2-2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E Wild Loop (Playwright)
        run: npm run test:wild-loop
