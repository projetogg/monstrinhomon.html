name: Tests (Vitest)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-and-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/matriz-quantitativa-passivas-especie-v2-2
          fetch-depth: 0

      - name: Aplicar atualização documental
        run: |
          base64 -d tmp/species-matrix-docs.mjs.gz.b64 | gzip -d > /tmp/update-species-matrix-docs.mjs
          node /tmp/update-species-matrix-docs.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Testar matriz quantitativa de espécies
        run: npm run test:species-passive-quantitative-v2-2

      - name: Testes unitários
        run: npm test

      - name: Publicar documentação validada
        run: |
          rm -f tmp/species-matrix-docs.mjs.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/ROADMAP.md
          git add -u tmp/species-matrix-docs.mjs.gz.b64
          git commit -m "docs(combat): atualizar governança após matriz de espécies"
          git push origin HEAD:codex/matriz-quantitativa-passivas-especie-v2-2

  wild-loop-e2e:
    runs-on: ubuntu-latest
    needs: unit-and-validation

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: codex/matriz-quantitativa-passivas-especie-v2-2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E Wild Loop
        run: npm run test:wild-loop
