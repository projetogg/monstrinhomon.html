name: Apply Group atkBonus patch

on:
  push:
    branches:
      - codex/group-atkbonus-preformula
    paths:
      - .github/workflows/apply-group-atkbonus-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/group-atkbonus-preformula
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar patch determinístico
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 trecho, encontrado {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          group_old = '''    // Calcular dano via fórmula canônica
              const basicPower = helpers.getBasicAttackPower(mon.class);
              const lvlDiff = (Number(mon.level) || 1) - (Number(enemy.level) || 1);

              const { damage: baseDmg, isIlusory } = computeGroupDamage({
                  pwr: basicPower,
                  atk: effectiveAtk,
                  lvlDiff,
                  defEnemy: effectiveDef,
                  damageMult: classAdv.damageMult,
                  critBonus: confrontResult.critDmgBonus,
                  category: confrontResult.category,
                  d20ANatural: confrontResult.d20ANatural,
                  d20DNatural: confrontResult.d20DNatural,
              });

              let dmg = baseDmg;

              // A4: Passiva ofensiva do atacante (Ladino +10% dano)
              const atkClassPassive = CLASS_COMBAT_PASSIVES[mon.class];
              if (atkClassPassive?.attackBonus) {
                  dmg = Math.max(1, Math.round(dmg * (1 + atkClassPassive.attackBonus)));
              }
              // Passiva Caçador: +2 dano plano vs alvo HP < 50%
              dmg = applyHunterWeakTargetBonus(dmg, enemy, atkClassPassive);

              // PR-02: passiva de espécie do atacante
              const passiveStateAtk = enc.passiveState || (enc.passiveState = {});
              const atkSpeciesPassive = fireCombatEvent(mon, ON_ATTACK, {
                  hpPct: (Number(mon.hpMax) || 1) > 0 ? (Number(mon.hp) || 0) / (Number(mon.hpMax) || 1) : 0,
                  isOffensiveSkill: false,
                  isFirstAttackOfCombat: !passiveStateAtk.swiftclawFirstStrikeDone,
                  hasShadowstingCharge: !!passiveStateAtk.shadowstingDebuffCharged,
                  hasBellwaveRhythmCharge: !!passiveStateAtk.bellwaveRhythmCharged,
              });
              if (atkSpeciesPassive?.atkBonus) {
                  dmg = Math.max(1, dmg + atkSpeciesPassive.atkBonus);
                  helpers.log(enc, `✨ Passiva ${monName}: +${atkSpeciesPassive.atkBonus} ATK`);
                  passiveStateAtk.swiftclawFirstStrikeDone = true;
                  passiveStateAtk.shadowstingDebuffCharged = false;
                  passiveStateAtk.bellwaveRhythmCharged = false;
              }

              // A4: Passiva defensiva do defensor'''

          group_new = '''    // PR-02: passiva de espécie do atacante
              // DEC-SPECIES-ATK-01: o bônus modifica o ATK usado na fórmula de dano,
              // sem alterar retroativamente a categoria de RC já resolvida.
              const passiveStateAtk = enc.passiveState || (enc.passiveState = {});
              const atkSpeciesPassive = fireCombatEvent(mon, ON_ATTACK, {
                  hpPct: (Number(mon.hpMax) || 1) > 0 ? (Number(mon.hp) || 0) / (Number(mon.hpMax) || 1) : 0,
                  isOffensiveSkill: false,
                  isFirstAttackOfCombat: !passiveStateAtk.swiftclawFirstStrikeDone,
                  hasShadowstingCharge: !!passiveStateAtk.shadowstingDebuffCharged,
                  hasBellwaveRhythmCharge: !!passiveStateAtk.bellwaveRhythmCharged,
              });
              let effectiveAtkForDamage = effectiveAtk;
              if (atkSpeciesPassive?.atkBonus) {
                  effectiveAtkForDamage = Math.max(
                      1,
                      effectiveAtkForDamage + atkSpeciesPassive.atkBonus,
                  );
                  helpers.log(enc, `✨ Passiva ${monName}: +${atkSpeciesPassive.atkBonus} ATK`);
                  passiveStateAtk.swiftclawFirstStrikeDone = true;
                  passiveStateAtk.shadowstingDebuffCharged = false;
                  passiveStateAtk.bellwaveRhythmCharged = false;
              }

              // Calcular dano via fórmula canônica
              const basicPower = helpers.getBasicAttackPower(mon.class);
              const lvlDiff = (Number(mon.level) || 1) - (Number(enemy.level) || 1);

              const { damage: baseDmg, isIlusory } = computeGroupDamage({
                  pwr: basicPower,
                  atk: effectiveAtkForDamage,
                  lvlDiff,
                  defEnemy: effectiveDef,
                  damageMult: classAdv.damageMult,
                  critBonus: confrontResult.critDmgBonus,
                  category: confrontResult.category,
                  d20ANatural: confrontResult.d20ANatural,
                  d20DNatural: confrontResult.d20DNatural,
              });

              let dmg = baseDmg;

              // A4: Passiva ofensiva do atacante (Ladino +10% dano)
              const atkClassPassive = CLASS_COMBAT_PASSIVES[mon.class];
              if (atkClassPassive?.attackBonus) {
                  dmg = Math.max(1, Math.round(dmg * (1 + atkClassPassive.attackBonus)));
              }
              // Passiva Caçador: +2 dano plano vs alvo HP < 50%
              dmg = applyHunterWeakTargetBonus(dmg, enemy, atkClassPassive);

              // A4: Passiva defensiva do defensor'''

          replace_once('js/combat/groupActions.js', group_old, group_new)

          structural_old = '''  it('caracteriza o estágio divergente de aplicação de atkBonus', () => {
              expect(wildBasic).toContain(
                'effectiveAtkForDamage = Math.max(1, effectiveAtkForDamage + atkPassive.atkBonus)',
              );
              expect(groupBasic).toContain(
                'dmg = Math.max(1, dmg + atkSpeciesPassive.atkBonus)',
              );
            });'''

          structural_new = '''  it('aplica atkBonus ao ATK efetivo antes da fórmula nos dois modos', () => {
              expect(wildBasic).toContain(
                'effectiveAtkForDamage = Math.max(1, effectiveAtkForDamage + atkPassive.atkBonus)',
              );

              const groupBonusIndex = groupBasic.indexOf(
                'effectiveAtkForDamage + atkSpeciesPassive.atkBonus',
              );
              const groupDamageIndex = groupBasic.indexOf(
                'const { damage: baseDmg, isIlusory } = computeGroupDamage({',
              );

              expect(groupBonusIndex).toBeGreaterThanOrEqual(0);
              expect(groupDamageIndex).toBeGreaterThan(groupBonusIndex);
              expect(groupBasic).toContain('atk: effectiveAtkForDamage');
              expect(groupBasic).not.toContain(
                'dmg = Math.max(1, dmg + atkSpeciesPassive.atkBonus)',
              );
            });'''

          replace_once('tests/speciesPassiveModeParityV22.test.js', structural_old, structural_new)

          observable_old = '''  it('DRIFT: wildpace pode ser neutralizado pelo arredondamento no Wild, mas soma +1 final no Group', () => {
              const wildBase = runWildBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: null }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });
              const wildPassive = runWildBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: 'wildpace' }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });
              const groupBase = runGroupBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: null }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });
              const groupPassive = runGroupBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: 'wildpace' }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });

              expect(wildPassive.damage - wildBase.damage).toBe(0);
              expect(groupPassive.damage - groupBase.damage).toBe(1);
            });'''

          observable_new = '''  it('PARITY: wildpace entra no ATK antes da fórmula nos dois modos', () => {
              const wildBase = runWildBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: null }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });
              const wildPassive = runWildBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: 'wildpace' }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });
              const groupBase = runGroupBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: null }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });
              const groupPassive = runGroupBasic({
                playerMonster: makeMonster({ hp: 30, canonSpeciesId: 'wildpace' }),
                enemy: makeEnemy(),
                d20A: 10,
                d20D: 10,
              });

              expect(wildPassive.damage - wildBase.damage).toBe(0);
              expect(groupPassive.damage - groupBase.damage).toBe(0);
              expect(groupBase.damage).toBe(wildBase.damage);
              expect(groupPassive.damage).toBe(wildPassive.damage);
            });'''

          replace_once('tests/speciesPassiveModeParityV22.test.js', observable_old, observable_new)
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar patch específico
        run: |
          npm run test:species-passive-parity-v2-2
          npm run test:combat-parity-v2-2
          npm run test:combat-simulation-v2-2

      - name: Commitar patch e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-group-atkbonus-patch.yml
          git add js/combat/groupActions.js tests/speciesPassiveModeParityV22.test.js
          git commit -m "fix(combat): aplicar atkBonus antes da fórmula no Group"
          git push origin HEAD:codex/group-atkbonus-preformula
